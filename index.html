  <div class="kopf1">

    <span class="marke">Entwurf</span>
    <span id="beispielMarke"></span>
    <div class="rechts">
      <span id="ordnerstatus" class="klein"></span>
      <label class="klein">Ich bin <select id="ich" onchange="ichWaehlen(this.value)"></select></label>
    </div>

<script>
"use strict";
/* ====================== Grundlagen ====================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function lies(k) { try { return localStorage.getItem("s2." + k); } catch (e) { return null; } }
function merke(k, v) { try { localStorage.setItem("s2." + k, v); } catch (e) {} }
function meldung(t) { const d = document.createElement("div"); d.className = "hinweis"; d.style.cssText = "position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2)"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }

const ARTEN = [
  { k: "SP", name: "Standortpraktikum", praktikum: true },
  { k: "BP", name: "Berufspraktikum", praktikum: true },
  { k: "PP", name: "Prüfungspraktikum", praktikum: true },
  { k: "PA", name: "Projektarbeit", praktikum: false },
  { k: "IVA", name: "Ind. Vertiefungsarbeit", praktikum: false },
  { k: "DP", name: "Diplomprüfung", praktikum: false },
];
const ART = Object.fromEntries(ARTEN.map((a) => [a.k, a]));
/* Stufen wie die Legende in der Excel-Liste: weiss = zu organisieren, rot = PxL zu finden, gelb = UB vereinbaren/durchführen, grün = abgeschlossen */
const STATUS_P = [
  ["offen", "noch zu organisieren", "weiss"],
  ["pxl_suchen", "PxL zu finden", "rot"],
  ["angefragt", "PxL angefragt", "rot"],
  ["zusage", "Zusage PxL · AVB ausstehend", "gelb"],
  ["avb", "AVB liegt vor · UB vereinbaren", "gelb"],
  ["ub_geplant", "UB vereinbart", "gelb"],
  ["abgeschlossen", "abgeschlossen", "gruen"],
  ["angerechnet", "angerechnet (Vorleistung)", "anger"],
];
const STATUS_A = [
  ["offen", "noch offen", "weiss"],
  ["laeuft", "Thema steht · in Arbeit", "gelb"],
  ["abgegeben", "abgegeben · Begutachtung", "gelb"],
  ["abgeschlossen", "abgeschlossen", "gruen"],
  ["angerechnet", "angerechnet (Vorleistung)", "anger"],
];
/* Diplomprüfung Fachdidaktik: Herbst (Sept/Jan, HS) oder Sommer (Juni/Juli, FS); eine Nachprüfung ist ein eigener Eintrag */
const STATUS_DP = [
  ["offen", "noch offen", "weiss"],
  ["geplant", "Termin steht", "gelb"],
  ["nachpruefung", "nicht bestanden · Nachprüfung", "rot"],
  ["abgeschlossen", "bestanden", "gruen"],
  ["angerechnet", "angerechnet (Vorleistung)", "anger"],
];
/* erledigt = abgeschlossen oder angerechnet (Vorleistung, z.B. Unterrichtserfahrung) – angerechnet zählt nicht in der Abrechnung */
const erledigt = (p) => p.status === "abgeschlossen" || p.status === "angerechnet";
const statusListe = (art) => (art === "DP" ? STATUS_DP : ART[art] && !ART[art].praktikum ? STATUS_A : STATUS_P);
const dpTermin = (p) => (/^HS/.test(p.semester || "") ? "Herbst" : /^FS/.test(p.semester || "") ? "Sommer" : "");
const statusInfo = (p) => statusListe(p.art).find((s) => s[0] === p.status) || statusListe(p.art)[0];
const STAND_STUDI = [["aktiv", "im Studium"], ["unterbruch", "Studienunterbruch"], ["abgeschlossen", "abgeschlossen"], ["exmatrikuliert", "exmatrikuliert"]];

function semKey(s) { const m = /^(HS|FS)(\d\d)$/.exec(s || ""); return m ? Number(m[2]) * 2 + (m[1] === "HS" ? 1 : 0) : 0; }

/* Speicher-Ordner nur im Browser (für «Beispiel ansehen») – gleiche Schnittstelle wie ein echter Ordner */
class MemDatei { constructor(n) { this.kind = "file"; this.name = n; this.inhalt = new Blob([]); }
  async getFile() { return new File([this.inhalt], this.name, { type: this.inhalt.type }); }
  async createWritable() { const h = this, teile = []; return { async write(d) { teile.push(d); }, async close() { h.inhalt = new Blob(teile, { type: teile[0] && teile[0].type || "" }); } }; } }
class MemOrdner { constructor(n) { this.kind = "directory"; this.name = n; this.k = new Map(); }
  async getDirectoryHandle(n, o = {}) { let x = this.k.get(n); if (!x) { if (!o.create) throw new DOMException(n, "NotFoundError"); x = new MemOrdner(n); this.k.set(n, x); } return x; }
  async getFileHandle(n, o = {}) { let x = this.k.get(n); if (!x) { if (!o.create) throw new DOMException(n, "NotFoundError"); x = new MemDatei(n); this.k.set(n, x); } return x; }
  async *entries() { for (const e of [...this.k]) yield e; } }

async function allesLaden() {
  const [st, px, pr, ei] = await Promise.all([leseJSON("stamm/studierende.json", { personen: [] }), leseJSON("stamm/praxislehrpersonen.json", { personen: [] }), leseJSON("stamm/praktika.json", { praktika: [] }), leseJSON("stamm/einstellungen.json", null)]);

  const liste = [], gesehen = new Set();
  try {
    const w = await verzeichnis("eintraege");
    for await (const [, d] of w.entries()) { if (d.kind !== "directory") continue;
      for await (const [n, f] of d.entries()) { if (f.kind !== "file" || !n.endsWith(".json")) continue;
        try { const e = JSON.parse(await (await f.getFile()).text()); if (e.id && !gesehen.has(e.id)) { gesehen.add(e.id); liste.push(e); } } catch (err) {} } }

function setze(obj, felder) {
  for (const [k, v] of Object.entries(felder)) {
    if (k.includes(".")) { const [a, b] = k.split("."); obj[a] = Object.assign({}, obj[a] || {}); if (v === null) delete obj[a][b]; else obj[a][b] = v; }
    else if (v === null) delete obj[k]; else obj[k] = v;
  }
}
const SAMMLUNG = { studi: "studis", pxl: "pxl", praktikum: "praktika" };
function berechnen() {
  const kopie = (l) => Object.fromEntries(l.map((x) => [x.id, JSON.parse(JSON.stringify(x))]));
  D = { studis: kopie(S.stamm.studis), pxl: kopie(S.stamm.pxl), praktika: kopie(S.stamm.praktika), einst: Object.assign(JSON.parse(JSON.stringify(EINST_STD)), S.stamm.einst || {}), hist: {}, notizen: {} };
  for (const e of S.eintraege) {
    if (e.typ === "bemerkung") { (D.notizen[e.ref] ||= []).push(e); continue; }
    if (e.typ === "einst") { setze(D.einst, e.felder); continue; }

    if (e.typ === "neu") sam[e.ref] = Object.assign({ id: e.ref, neu: e.zeit }, e.felder);
    else if (e.typ === "aendern" && sam[e.ref]) setze(sam[e.ref], e.felder);

    (D.hist[e.art + ":" + e.ref] ||= []).push(e);

  for (const p of Object.values(D.praktika)) if (p.geloescht) delete D.praktika[p.id];

  const alleDoz = (D.einst.team || []).map((t) => t.kuerzel);

}

function entfallGrund(s, art) {

  return s.profil ? "entfällt · " + s.profil : "entfällt";
}
function relevant(p) { const s = D.studis[p.student]; return !s || anwendbar(s, p.art) || p.semester || p.thema || p.pxl || (p.status !== "offen" && p.status !== "pxl_suchen"); }
const praktikaVon = (sid) => Object.values(D.praktika).filter((p) => p.student === sid && relevant(p)).sort((a, b) => (semKey(a.semester) || 999) - (semKey(b.semester) || 999));
/* Wahlpflichtbereich (Übersicht Verläufe): Individuelle Spezialisierung (IVA) oder Berufspädagogik;

const WAHL = [["", "noch offen"], ["IVA", "Individuelle Spezialisierung (IVA)"], ["BPAED", "Berufspädagogik"], ["ADD", "Additum inkl. Projektarbeit"]];
/* Synergie BMS heisst immer Wahlpflicht Berufspädagogik (dann ist die IVA nicht unsere Sache) */
function wahlVon(s) { return s.wahl || (s.wpb || Object.values(D.praktika).some((p) => p.student === s.id && p.art === "BP" && p.bms) ? "BPAED" : ""); }

/* Abgabetermin einheitlich: «2.27», «–6.27», «Jan. 27», «- 9.1.2026» → «Feb 2027», «Jun 2027», «Jan 2027», «9. Jan 2026» */
const MONATE = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
function abgabeText(t) {
  let r = String(t || "").replace(/^[\s·*–—-]+|[\s*]+$/g, "").replace(/^(geplant|Abgabe|Abschluss)\s*(\(geplant\))?\s*:?\s*[–-]?\s*/i, "").trim();
  if (!r) return "";
  const frage = /\?/.test(r) ? " (?)" : "", jahr = (y) => (y.length === 2 ? "20" + y : y);
  let m = /^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{2}|\d{4})\b/.exec(r);
  if (m && m[2] >= 1 && m[2] <= 12) return `${Number(m[1])}. ${MONATE[m[2] - 1]} ${jahr(m[3])}${frage}`;
  m = /^(\d{1,2})\.\s?(\d{2}|\d{4})\b/.exec(r);
  if (m && m[1] >= 1 && m[1] <= 12) return `${MONATE[m[1] - 1]} ${jahr(m[2])}${frage}`;
  m = /^((?:Ende|Anfang|Mitte)\s+)?([A-Za-zäÄ]{3,})\.?\s*(\d{2}|\d{4})\b/.exec(r);

function hinweisListe(p) { return (p.hinweis !== undefined && p.hinweis !== null ? String(p.hinweis).split("\n") : p.hinweise || []).map((x) => x.trim()).filter(Boolean); }
function umfangZahl(t) { const m = /(\d+(?:[.,]\d+)?)\s*(h|L\b|L\.|Lekt|Lektionen)?/i.exec(String(t || "")); return m ? Number(m[1].replace(",", ".")) : null; }
function umfangKurz(p) {

/* ====================== Lektionen aus der Ausbildungsvereinbarung ======================

   sonst (und bei PDF) werden Zeilen mit Datum und Zeitspanne gesucht. Immer nur ein Vorschlag – man prüft ihn im Fenster.

async function pdfZeilen(datei) {

      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5]; let g = gruppen.find((g) => Math.abs(g.y - y) < 3);
      if (!g) gruppen.push((g = { y, teile: [] }));
      g.teile.push({ x: it.transform[4], ende: it.transform[4] + (it.width || 0), t: it.str });
    }
    gruppen.sort((a, b) => b.y - a.y);
    for (const g of gruppen) {
      g.teile.sort((a, b) => a.x - b.x);
      let t = "", ende = null;
      for (const s of g.teile) { t += ende === null ? "" : s.x - ende > 12 ? " | " : s.x - ende > 1 ? " " : ""; t += s.t; ende = s.ende; }
      zeilen.push({ text: t.replace(/\s+/g, " ").trim() });

}

    for (const k of knoten.children) {

      else if (k.nodeName === "w:tbl") {
        for (const tr of [...k.children].filter((x) => x.nodeName === "w:tr")) {
          const zellen = [...tr.children].filter((x) => x.nodeName === "w:tc").map((tc) => [...tc.children].filter((x) => x.nodeName === "w:p").map(absatz).filter(Boolean));
          zeilen.push({ text: zellen.map((z) => z.join(" ")).join(" | "), zellen: zellen.map((z) => z.join(" ")) });
          // Zellen mit mehreren Absätzen (z.B. eine Lektion pro Absatz): jeden Absatz auch einzeln
          zellen.forEach((z, i) => { if (z.length > 1) for (const a of z) zeilen.push({ text: (zellen[0][0] || "") + " | " + a, teil: true }); });
          for (const tc of [...tr.children].filter((x) => x.nodeName === "w:tc")) for (const inner of [...tc.children].filter((x) => x.nodeName === "w:tbl")) lauf({ children: [inner] });
        }

const ZEIT2 = /(\d{1,2})[.:h](\d{2})\s*(?:Uhr)?\s*(?:–|—|-|−|·|bis)\s*(\d{1,2})[.:h](\d{2})/;

  let j;

function lektionenAus(zeilen, sem) {
  const L = []; let modus = "", aktiv = false, kopf = null, letzteKlasse = { U: "", H: "" };

      const art = /hosp/i.test(c("art")) ? "H" : kopf.art >= 0 ? "U" : modus || "U";

      continue;

    if ((/Hospitation/i.test(t) && !/mit Hospitation|inkl\.? Hospitation/i.test(t)) || /Anzahl und Daten der(?! Zeiten)/i.test(t)) { modus = "H"; aktiv = true; }

      .replace(/oder\s+\d{1,2}\.\s?\d{1,2}\.?(?:\d{2,4})?/i, "").replace(/\(?\s*(\d+|eine|zwei|drei)\s*Lektion(?:en)?\s*\)?/i, "").replace(/(?:Zi\.?|Zimmer|Raum)\s*[\w.-]+/i, "")

async function lektionenLesen(id, datei) {
  try {
    const zeilen = await avbZeilen(datei);
    if (!zeilen) return lektionenDialog(id, [], `«${datei.name}» kann die Seite nicht lesen (nur PDF oder Word .docx) – bitte die Lektionen von Hand eintragen.`);
    const l = lektionenAus(zeilen, D.praktika[id].semester);
    lektionenDialog(id, l, l.length ? `${l.length} Lektionen in der Ausbildungsvereinbarung gefunden – bitte prüfen und ergänzen.` : "In der Datei wurden keine Lektionen mit Datum und Uhrzeit gefunden (Scan? andere Vorlage?). Bitte von Hand eintragen.");
  } catch (e) { lektionenDialog(id, [], "Lesen ging nicht: " + e.message + " – bitte von Hand eintragen."); }

/* ---------- Reiter «Lektionen»: alle Praktikumslektionen eines Semesters nach Wochen ---------- */

    if (S.f.nurMeine && S.ich && !istMeins(p)) continue;
    (p.lektionen || []).forEach((l, i) => { if (S.f.lekNurUB && !istBesuch(p, l)) return; if (S.f.lekOhneH && l.art === "H") return; alle.push({ p, l, i, s }); });
    if (p.ub && !(p.lektionen || []).some((l) => istBesuch(p, l))) alle.push({ p, l: { art: "U", datum: p.ub, von: p.ubZeit || "", bis: p.ubBis || "", klasse: p.ubOrt || "" }, i: -1, s });

    return `<div class="lek ${b ? "ub" : ""} ${l.art === "H" ? "hosp" : ""}" style="${l.datum < heute ? "opacity:.5" : ""}" title="${esc([nameVon(s), ART[p.art].name, x && pxlKurz(x) + " · " + schuleKurz(x), l.klasse && "Kl. " + l.klasse, l.raum && "Zi. " + l.raum, b ? "Besuch" : i >= 0 && l.art !== "H" ? "Klick: als Besuch wählen" : ""].filter(Boolean).join("\n"))}"
      onclick="${b ? `praktikumDialog('${p.id}')` : i >= 0 && l.art !== "H" ? `if (confirm('Diese Lektion als Besuch wählen?')) besuchWaehlen('${p.id}', ${i})` : `praktikumDialog('${p.id}')`}">
      <b>${esc(l.von || "?")}${l.bis ? "–" + esc(l.bis) : ""}</b> ${b ? "· <b>Besuch</b>" : l.art === "H" ? "· Hosp." : ""}<br>${esc(s.name)} ${esc((s.vorname || "")[0] || "")}. · ${p.art} · ${dozMarken(p)}<br><span class="mini">${esc(x ? schuleKurz(x) : "")}${l.klasse ? " · " + esc(l.klasse) : ""}</span></div>`; };
  const tage = ["Mo", "Di", "Mi", "Do", "Fr", "Sa"];

  ${Object.keys(wochen).sort().map((w) => { const tagListe = tage.filter((t, k) => k < 5 || wochen[w].some((e) => wochentag(e.l.datum) === t));

/* ---------- Verläufe (das Raster der Excel-Liste) ---------- */
function studisGefiltert() {
  const q = S.f.suche.trim().toLowerCase();
  return Object.values(D.studis).filter((s) => {
    if (S.f.stand === "aktiv" && istArchiv(s)) return false;
    if (S.f.stand === "fertig" && !istArchiv(s)) return false;
    if (q && !`${s.name} ${s.vorname} ${s.wohnort} ${s.start}`.toLowerCase().includes(q) && !praktikaVon(s.id).some((p) => (D.pxl[p.pxl] && pxlKurz(D.pxl[p.pxl]).toLowerCase().includes(q)) || (p.thema || "").toLowerCase().includes(q))) return false;
    const pl = praktikaVon(s.id);
    if (S.f.doz && !pl.some((p) => (S.f.doz === "beide" ? (p.doz || []).length > 1 : beteiligt(p, S.f.doz)))) return false;
    if (S.f.sem && !pl.some((p) => p.semester === S.f.sem)) return false;
    if (S.f.status && !pl.some((p) => statusInfo(p)[2] === S.f.status)) return false;
    return true;
  }).sort((a, b) => semKey(a.start) - semKey(b.start) || a.name.localeCompare(b.name));

  const si = statusInfo(p), x = D.pxl[p.pxl], fertig = erledigt(p);
  const ab = (S.f.sem && p.semester !== S.f.sem) || (S.f.doz && !(S.f.doz === "beide" ? (p.doz || []).length > 1 : beteiligt(p, S.f.doz)));
  const z = (inhalt, cls = "", titel = "") => `<div class="kz ${cls}" ${titel ? `title="${esc(titel)}"` : ""}>${inhalt}</div>`;

  const zeilen = [];

    else if (p.pxlText) { zeilen.push(z(esc(p.pxlText), "", "nicht in der PxL-Liste")); if (p.pxlOrt) zeilen.push(z(esc(p.pxlOrt), "leise")); }
    if (!fertig && !["ub_geplant"].includes(p.status)) zeilen.push(z(esc(si[1]), "leise"));
    // klar abgetrennt: Besuch

    if (p.ub) besuch = `${p.art === "PP" ? "Prüfung" : "UB"} ${wochentag(p.ub)} ${datumKurz(p.ub)}${p.ubZeit ? ", " + esc(p.ubZeit) : ""}`;

    else besuch = `<span class="warn">⚠ UB vereinbaren</span>`;
    zeilen.push(z(besuch + (p.vbDatum && !fertig && (!p.ub || p.vbDatum <= p.ub) ? ` <span class="leise">· VB ${datumKurz(p.vbDatum)}</span>` : ""), "besuch"));

  const bmsKachel = p.art === "BP" && p.bms ? `<div class="kachel st-bms" onclick="praktikumDialog('${p.id}')" title="Synergie Berufspädagogik – selbst organisiert, kein Besuch"><div class="kz k1"><span>BMS · ${bmsTeile(p).bms} L · selbst organisiert</span></div>${bx ? `<div class="kz">${esc(pxlKurz(bx))}</div>` : ""}<div class="kz leise">${esc(bx ? schuleKurz(bx) : p.bmsText || "Ort noch offen")}</div><div class="kz besuch leise">kein Besuch</div></div>` : "";

}

  const opts = []; for (let k = semKey(semHeute()) + 2; k >= semKey("FS20"); k--) opts.push(semAus(k));
  return `<select class="beginn" onclick="event.stopPropagation()" onchange="beginnSetzen('${s.id}', this.value)"><option value="">?</option>${opts.map((x) => `<option ${x === s.start ? "selected" : ""}>${x}</option>`).join("")}</select>`;

async function beginnSetzen(id, sem) { await eintragen({ typ: "aendern", art: "studi", ref: id, felder: { start: sem || null } }); }
/* Filter wie in der Praxisbesuche-App: beschriftete Felder in einer Zeile, darunter was aktiv ist */
function filterBox(mitPraktikum, anzahl) {
  const sel = (k, opts) => `<select onchange="filter('${k}', this.value)">${opts.map(([v, t]) => `<option value="${v}" ${(S.f[k] || "") === v ? "selected" : ""}>${t}</option>`).join("")}</select>`;
  const team = (D.einst.team || []).map((t) => [t.kuerzel, t.kuerzel + (t.name ? " · " + t.name : "")]);
  const aktiv = [S.f.stand !== "aktiv" && (S.f.stand === "fertig" ? "Archiv" : "alle Personen"), S.f.doz && "Doz " + S.f.doz,
    mitPraktikum && S.f.sem && "Semester " + S.f.sem, mitPraktikum && S.f.status && "Stand " + { weiss: "zu organisieren", rot: "PxL", gelb: "läuft", gruen: "fertig" }[S.f.status], S.f.suche && "«" + S.f.suche + "»"].filter(Boolean);
  return `<div class="filter">
    <label>Suchen<input type="search" id="suche" placeholder="Name, Ort, PxL, Thema" value="${esc(S.f.suche)}" oninput="filterTipp('suche', this.value)"></label>
    <label>Personen${sel("stand", [["aktiv", "im Studium"], ["fertig", "Archiv"], ["alle", "alle"]])}</label>
    <label>Doz${sel("doz", [["", "alle"], ...team, ["beide", "zu zweit"]])}</label>
    ${mitPraktikum ? `<label>Semester${sel("sem", [["", "alle"], ...semesterListe().map((x) => [x, x])])}</label>
    <label>Stand${sel("status", [["", "alle"], ["weiss", "zu organisieren"], ["rot", "PxL suchen / angefragt"], ["gelb", "läuft"], ["gruen", "abgeschlossen"], ["anger", "angerechnet"]])}</label>` : ""}
    <span class="ffuss"><b>${anzahl}</b> Personen${aktiv.length ? ` · <span class="faktiv">${aktiv.map(esc).join(" · ")}</span> <span class="link klein" onclick="filterZurueck()">zurücksetzen</span>` : ""}</span>
    <button style="margin-left:auto" onclick="studiDialog()">＋ neue Person</button></div>`;
}

const ansichtUmschalter = () => `<div class="umschalter">${[["kacheln", "▦ Verlauf wie Excel"], ["liste", "☰ übersichtliche Liste"]].map(([k, t]) => `<span class="chip ${(S.f.studAnsicht || "kacheln") === k ? "an" : ""}" onclick="filter('studAnsicht','${k}')">${t}</span>`).join("")}</div>`;
function vStudierende() {

    return pl.map((p) => { const x = D.pxl[p.pxl]; return `<span class="pille st-${statusInfo(p)[2]}${p.bms ? " bms" : ""}" title="${esc([a.name + (p.semester ? " " + p.semester : ""), statusInfo(p)[1], dozText(p), x && pxlKurz(x), p.ub && "UB " + ubText(p), p.art === "BP" && bpHinweis(p)].filter(Boolean).join(" · "))}">${a.k}</span>`; }).join("");
  }).join("");
  const naechstes = (s) => {
    const p = praktikaVon(s.id).filter((p) => !erledigt(p)).sort((a, b) => (semKey(a.semester) || 999) - (semKey(b.semester) || 999))[0];
    if (!p) return alleFertig(s) && !istArchiv(s) ? `<span class="ok">✓ alles abgeschlossen</span> <button class="klein" onclick="event.stopPropagation(); archivieren('${s.id}', true)">ins Archiv</button>` : "";
    return `${dozMarken(p)} <b>${p.art}</b> ${esc(p.semester || "ohne Semester")} · ${esc(statusInfo(p)[1])}${p.ub ? ` · <b>UB ${wochentag(p.ub)} ${datumKurz(p.ub)}</b>` : ""}${dozMarken(p)}`;

  return `<h2>Studierende</h2>${ansichtUmschalter()}

  ${liste.map((s) => `<tr class="klickbar" onclick="personZeigen('${s.id}')"><td><b>${esc(s.name)}</b> ${esc(s.vorname)}${(D.notizen[s.id] || []).length || s.bemerkung ? ` <span class="leise" title="hat Bemerkungen">✎</span>` : ""}${s.stand === "unterbruch" ? ` <span class="mini nein">Unterbruch</span>` : ""}</td><td onclick="event.stopPropagation()">${beginnFeld(s)}</td><td style="white-space:nowrap">${pillen(s)}</td><td class="klein">${naechstes(s)}</td></tr>`).join("")}
  </tbody></table>

}

async function verfSetzen(xid, sem, stand) {

  const offen = pr.filter((p) => ART[p.art].praktikum && ["offen", "pxl_suchen", "angefragt"].includes(p.status));
  const ohneSem = Object.values(D.praktika).filter((p) => relevant(p) && !p.semester && !erledigt(p) && D.studis[p.student] && D.studis[p.student].stand === "aktiv" && !istArchiv(D.studis[p.student]));
  const belegt = {}; for (const p of pr) if (p.pxl) (belegt[p.pxl] ||= []).push(p);
  const team = D.einst.team || [];
  const last = team.map((t) => { const meine = pr.filter((p) => (p.doz || []).includes(t.kuerzel)); const std = meine.length; return { t, n: meine.length, std, arten: ARTEN.map((a) => [a.k, meine.filter((p) => p.art === a.k).length]).filter((x) => x[1]) }; });
  const optionen = (p) => {
    const vorher = new Set(praktikaVon(p.student).filter((q) => q.id !== p.id).map((q) => q.pxl));
    const rang = (x) => { const v = verfVon(x, sem).stand || ""; return (passtNicht(x, p) ? 40 : 0) + ({ ja: 0, vielleicht: 1, angefragt: 2, "": 3, nein: 20 }[v] ?? 3) + (belegt[x.id] && !belegt[x.id].includes(p) ? 5 : 0) + (vorher.has(x.id) ? 10 : 0); };
    const l = Object.values(D.pxl).sort((a, b) => rang(a) - rang(b) || a.name.localeCompare(b.name));
    return `<option value="">– PxL wählen –</option>` + l.map((x) => {
      const v = verfVon(x, sem).stand, nicht = passtNicht(x, p), schon = (belegt[x.id] || []).filter((q) => q.id !== p.id);
      const zusatz = [v ? "verfügbar: " + v : "", nicht, schon.length ? "schon: " + schon.map((q) => q.art + " " + D.studis[q.student].name).join(", ") : "", vorher.has(x.id) ? "war schon PxL dieser Person" : "", x.reise].filter(Boolean).join(" · ");
      return `<option value="${x.id}" ${p.pxl === x.id ? "selected" : ""}>${v === "ja" ? "✓ " : v === "nein" || nicht ? "✗ " : ""}${esc(x.name)} ${esc(x.vorname)} – ${esc(schuleKurz(x))} (${esc(x.kanton)})${zusatz ? " · " + esc(zusatz) : ""}</option>`;
    }).join("");
  };

    return `<tr><td><span class="link" onclick="personZeigen('${s.id}')"><b>${esc(s.name)}</b> ${esc(s.vorname)}</span><div class="mini">${esc([s.profil, s.wohnort && "wohnt " + s.wohnort, s.pensum].filter(Boolean).join(" · "))}</div></td>
    <td><span class="link" onclick="praktikumDialog('${p.id}')">${p.art}</span><div class="mini">${esc(umfangKurz(p))}${p.umfangNotiz ? ` <span title="${esc(p.umfangNotiz)}">ⓘ</span>` : ""}</div>${p.art === "BP" && bpHinweis(p) ? `<div class="mini"><b>${esc(bpHinweis(p))}</b></div>` : ""}</td>
    <td class="klein">${esc(p.wunsch || "")}</td>
    <td style="white-space:nowrap">${darf ? dozPillen("z_" + p.id, p.doz, "dozSetzen('" + p.id + "', this.dataset.k, !this.classList.contains('an'))") : dozMarken(p)}</td>

  };
  return `<h2>Zuteilung</h2>

      if (nn && such(kopf).includes(nn)) p += 5; if (vn && such(kopf).includes(vn)) p += 2;

async function praktikumSpeichern(id, sid) {
  const v = (k) => { const el = $("#f_" + k); return el ? el.value.trim() : undefined; };
  const art = v("art"), neu = { art, hinweis: v("hinweis") ?? "", semester: v("semester"), doz: art === "DP" ? (D.einst.team || []).map((t) => t.kuerzel) : gewaehlteDoz("f_doz"), vertretung: art === "DP" ? [] : gewaehlteDoz("f_vertretung"), status: v("status"), notiz: v("notiz") };
  if (ART[art].praktikum) Object.assign(neu, { umfang: v("umfang") ?? "", wunsch: v("wunsch") ?? "", pxl: v("pxl") ?? "", ub: v("ub") ?? "", ubZeit: v("ubZeit") ?? "", ubBis: v("ubBis") ?? "", ubOrt: v("ubOrt") ?? "", vbDatum: v("vbDatum") ?? "", vbZeit: v("vbZeit") ?? "", vbOrt: v("vbOrt") ?? "", avb: !!($("#f_avb") || {}).checked, aeb: !!($("#f_aeb") || {}).checked });
  if (art === "BP" && $("#f_bms") && $("#f_bms").checked && D.studis[sid] && D.studis[sid].wahl !== "BPAED") await eintragen({ typ: "aendern", art: "studi", ref: sid, felder: { wahl: "BPAED", wpb: true } });
  if (art === "BP" && $("#f_bms")) Object.assign(neu, { bms: $("#f_bms").checked, bmsText: v("bmsText") ?? "", bmsPxl: v("bmsPxl") ?? "", bmsUmfang: v("bmsUmfang") ?? "", verkuerzt: $("#f_verkuerzt").checked });
  else if (art === "DP") Object.assign(neu, { datum: v("datum") ?? "", nachpruefung: !!($("#f_nachpruefung") || {}).checked });
  else Object.assign(neu, { thema: v("thema") ?? "", abgabe: abgabeText(v("abgabe") ?? ""), ...(art === "IVA" && $("#f_ects") ? { ects: Number(v("ects")) } : {}) });
  if (!statusListe(art).some((s) => s[0] === neu.status)) neu.status = "offen";
  // E-Mail/Telefon der PxL hier ergänzt → bei der PxL speichern
  const xm = v("pxlMail"), xt = v("pxlTel");
  if (neu.pxl && D.pxl[neu.pxl] && (xm || (xt && xt !== (D.pxl[neu.pxl].tel || "")))) {
    if (xm && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(xm)) return meldung("Die E-Mail-Adresse sieht nicht richtig aus.");
    if (!(await eintragen({ typ: "aendern", art: "pxl", ref: neu.pxl, felder: Object.assign(xm ? { mail: xm } : {}, xt ? { tel: xt } : {}) }))) return;
  }
  if (id && neu.hinweis === hinweisListe(D.praktika[id]).join("\n")) delete neu.hinweis;
  if (id) { const f = unterschiede(D.praktika[id], neu); if (Object.keys(f).length && !(await eintragen({ typ: "aendern", art: "praktikum", ref: id, felder: f }))) return; }
  else { const f = Object.fromEntries(Object.entries(neu).filter(([, x]) => x !== "" && x !== false && !(Array.isArray(x) && !x.length))); f.student = sid; if (!(await eintragen({ typ: "neu", art: "praktikum", ref: neueId("n"), felder: f }))) return; }
  $("#dlg").close();
}

function apWaehlen(sid) { const i = document.createElement("input"); i.type = "file"; i.accept = ".pdf,.docx"; i.onchange = () => i.files[0] && apHochladen(sid, i.files[0]); i.click(); }
async function apHochladen(sid, datei) {
  if (!S.ich) return meldung("Bitte oben rechts «Ich bin» wählen.");
  const s = D.studis[sid], end = (datei.name.match(/\.[a-z0-9]+$/i) || [".pdf"])[0].toLowerCase();
  const basis = dateiName(`Ausbildungsplan ${s.name} ${s.vorname} ${heuteKurz()}`); let pfad, nr = 1;
  while (true) { pfad = `Ausbildungspläne/${basis}${nr > 1 ? ` (${nr})` : ""}${end}`; try { await wurzelDatei(pfad); nr++; } catch (e) { break; } }
  try { const w = await (await wurzelDatei(pfad, true)).createWritable(); await w.write(datei); await w.close(); } catch (e) { return meldung("Hochladen ging nicht: " + e.message); }
  if (await eintragen({ typ: "aendern", art: "studi", ref: sid, felder: { ausbildungsplan: pfad } })) meldung("Ausbildungsplan abgelegt: " + pfad);

  const neu = { name: v("name"), vorname: v("vorname"), start: v("start").replace(/\s/g, "").toUpperCase(), profil: v("profil"), wahl: v("wahl"), wpb: v("wahl") === "BPAED", faecher: v("faecher"), pensum: v("pensum"), wohnort: v("wohnort"), mail: v("mail"), abschluss: v("abschluss"), stand: v("stand"), bemerkung: v("bemerkung") };
  if (!neu.name) return meldung("Bitte einen Namen eintragen.");
  if (id) { const f = unterschiede(D.studis[id], neu); if (Object.keys(f).length && !(await eintragen({ typ: "aendern", art: "studi", ref: id, felder: f }))) return; $("#dlg").close(); }
  else {
    const sid = neueId("s"); if (!(await eintragen({ typ: "neu", art: "studi", ref: sid, felder: neu }))) return;
    // Bausteine laut Profil gleich anlegen (ohne Semester)
    for (const a of ARTEN) if (anwendbar(neu, a.k)) await eintragen({ typ: "neu", art: "praktikum", ref: neueId("n"), felder: { student: sid, art: a.k, status: "offen", ...(sollUmfang(neu, a.k) ? { umfang: sollUmfang(neu, a.k) } : {}) } });
    $("#dlg").close(); personZeigen(sid);
  }
}

/* Praxislehrpersonen */

  const x = id ? D.pxl[id] : { name: "", vorname: "", schultyp: "Gymnasium", kanton: "LU" }, sems = semesterListe().filter((s) => semKey(s) >= semKey(semHeute()) - 1);

    ${x.planung ? `<label>Excel «Betreuung HS26»</label><span class="klein">${esc(x.planung)}</span>` : ""}</div>`;

    <div class="abschnitt"><h4>Verfügbarkeit</h4><table class="lekttab"><tbody>${sems.map((s) => { const v = verfVon(x, s); return `<tr><td><b>${s}</b></td><td><select id="v_${s}">${VERF.map(([k, t]) => `<option value="${k}" ${(v.stand || "") === k ? "selected" : ""}>${t}</option>`).join("")}</select></td><td><input id="vn_${s}" value="${esc(v.notiz || "")}" placeholder="z.B. nur BP, max. 1" size="28"></td></tr>`; }).join("")}</tbody></table></div>
    <div class="abschnitt"><h4>Bemerkungen <button class="klein" onclick="const b=$('#pxlBemBox'); b.hidden=!b.hidden; if(!b.hidden) $('#pxlBem').focus()">＋ neu</button></h4>
      <div id="pxlBemBox" hidden><textarea id="pxlBem" rows="2" placeholder="Bemerkung zu ${esc(pxlKurz(x))} …"></textarea><button class="klein haupt" onclick="bemerkungSpeichern('${id}', 'pxl', 'pxlBem')">speichern</button></div>
      <div id="pxlNotizen">${notizen.map(notizHtml).join("") || `<p class="leise klein" id="pxlKeine">Noch keine.</p>`}</div></div>
    <div class="abschnitt"><h4>Begleitungen (${bt.length})</h4>${bt.length ? `<ul class="klein" style="margin:0;padding-left:18px">${bt.slice(0, 6).map((p) => `<li><span class="link" onclick="praktikumDialog('${p.id}')">${p.semester || "–"} · ${p.art} ${esc(nameVon(D.studis[p.student]))}</span> <span class="punkt st-${statusInfo(p)[2]}"></span> ${avbLink(p)}</li>`).join("")}</ul>${bt.length > 6 ? `<details><summary class="mini">${bt.length - 6} frühere</summary><ul class="klein">${bt.slice(6).map((p) => `<li>${p.semester || "–"} · ${p.art} ${esc(nameVon(D.studis[p.student]))}</li>`).join("")}</ul></details>` : ""}` : `<p class="leise klein">Keine.</p>`}
      ${(x.betreuungen || []).length ? `<details><summary class="mini">laut Excel-Spalten «Betreuung»</summary><p class="klein leise">${x.betreuungen.map((b) => `${b.semester} ${esc(b.text)}`).join(" · ")}</p></details>` : ""}</div>
    <details class="weiteres"><summary class="klein leise">Angaben ändern</summary>${angaben}${verlaufHtml("pxl", id)}</details>`;
  dialog(id ? esc(pxlKurz(x)) : "Neue Praxislehrperson", inhalt, `<button onclick="$('#dlg').close()">Abbrechen</button><button class="haupt" onclick="pxlSpeichern(${id ? `'${id}'` : "null"})">Speichern</button>`);
}
const notizHtml = (e) => `<div class="notiz">${esc(e.text)}<div class="wer">${esc(e.wer)}, ${new Date(e.zeit).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" })}</div></div>`;
async function pxlSpeichern(id) {
  const v = (k) => $("#x_" + k).value.trim();
  const neu = Object.fromEntries(["name", "vorname", "schultyp", "kanton", "schule", "mail", "tel", "reise", "adresse", "nebenfach", "hochschule", "hinweise", "kurz"].map((k) => [k, v(k)]));
  if (!neu.name) return meldung("Bitte einen Namen eintragen.");
  if (id) {
    const f = unterschiede(D.pxl[id], neu);
    for (const s of semesterListe().filter((s) => semKey(s) >= semKey(semHeute()) - 1)) {
      const el = $("#v_" + s); if (!el) continue; const alt = verfVon(D.pxl[id], s), stand = el.value, notiz = $("#vn_" + s).value.trim();
      if ((alt.stand || "") !== stand || (alt.notiz || "") !== notiz) f["verfuegbar." + s] = stand || notiz ? { stand, notiz } : null;
    }
    if (Object.keys(f).length && !(await eintragen({ typ: "aendern", art: "pxl", ref: id, felder: f }))) return;
  } else {
    const xid = neueId("p");
    if (!(await eintragen({ typ: "neu", art: "pxl", ref: xid, felder: neu }))) return;
    // aus einem Praktikum heraus angelegt: gleich dort eintragen und zurück
    if (S.nachPxl !== undefined && S.nachPxl !== null) {
      const pid = S.nachPxl; S.nachPxl = null;
      if (pid && D.praktika[pid]) { await eintragen({ typ: "aendern", art: "praktikum", ref: pid, felder: { pxl: xid } }); return praktikumDialog(pid); }
      if (S.vorlage) return praktikumDialog(null, Object.assign({}, S.vorlage, { pxl: xid }));
    }
  }
  S.nachPxl = null;
  $("#dlg").close();
}

/* ====================== Beispiel (erfundene Daten) ====================== */
async function beispielLaden() {
  const w = new MemOrdner("App"), o = await w.getDirectoryHandle("Daten", { create: true }); S.wurzel = w; S.ordner = o; S.beispiel = true; S.detail = null; S.privat = null; S.pensen = null; S.eingang = null; S.vorlagen = null;
  const vn = ["Lea", "Noah", "Mia", "Luca", "Sara", "Jonas", "Elena", "David", "Nina", "Tim", "Anna", "Ben"], nn = ["Muster", "Beispiel", "Probst", "Fiktiv", "Erfunden", "Platzhalter", "Annahme", "Vorlage", "Skizze", "Entwurf", "Testa", "Modell"];
  const schulen = [["LU", "Gymnasium", "Kantonsschule Seeblick"], ["LU", "Gymnasium", "Kantonsschule Bergtal"], ["ZG", "Gymnasium", "Kantonsschule Am See"], ["SZ", "Gymnasium", "Stiftsschule Talgrund"], ["AG", "Gymnasium", "Alte Kantonsschule Flussstadt"], ["ZH", "Gymnasium", "Gymnasium Hügelweg"], ["LU", "FMS", "FMS Seeblick"], ["ZG", "FMS", "FMS Am See"], ["ZH", "BMS", "Berufsmaturitätsschule Werkstadt"], ["NW", "Gymnasium", "Kollegium Talboden"]];
  const pxl = schulen.flatMap(([kt, typ, sch], i) => [0, 1].slice(0, i < 6 ? 2 : 1).map((j) => ({ id: `px${i}${j}`, kanton: kt, schultyp: typ, name: nn[(i * 2 + j) % 12] + (j ? "-Lehrer" : "-Lehrerin"), vorname: vn[(i + j * 5) % 12], mail: `pxl${i}${j}@beispiel.invalid`, tel: "", schule: sch, reise: `ca. ${1 + (i % 3) / 2} Std.`, hinweise: ["ab Aug 26", "", "nur BP", "", "kein PP", ""][(i + j) % 6], kurz: i === 3 ? "70-Min.-Lektionen" : "", betreuungen: [], verfuegbar: { HS26: { stand: ["ja", "", "nein", "angefragt", "ja", "vielleicht"][(i + j) % 6] }, FS27: { stand: ["ja", "ja", "", "", "nein", ""][(i + j) % 6] } } })));
  const studis = [], praktika = [];
  const plan = [
    ["FS25", "Monofach", ["FS25", "wec", "SP", "abgeschlossen", 0], ["HS25", "alh", "BP", "abgeschlossen", 6], ["HS26", "wec", "PP", "ub_geplant", 2], ["HS26", "wec", "PA", "laeuft"]],
    ["FS25", "Monofach", ["FS25", "wec", "SP", "abgeschlossen", 1], ["FS26", "alh", "BP", "abgeschlossen", 7], ["HS26", "alh+wec", "PP", "angefragt", 4], ["FS27", "wec", "IVA", "offen"]],
    ["HS25", "Monofach", ["HS25", "wec", "SP", "abgeschlossen", 3], ["HS26", "alh+wec", "BP", "abgeschlossen", 0], ["FS27", "", "PP", "pxl_suchen"]],
    ["HS25", "Erstfach", ["HS25", "alh", "SP", "abgeschlossen", 2], ["HS26", "wec", "BP", "avb", 5], ["", "", "PP", "offen"]],
    ["HS26", "Monofach", ["HS26", "wec", "SP", "ub_geplant", 8], ["HS26", "wec", "BP", "angefragt", 9], ["", "", "PP", "offen"]],
    ["HS26", "Zusatzfach", ["HS26", "wec", "BP", "pxl_suchen"], ["", "", "PP", "offen"]],
    ["HS26", "Monofach", ["HS26", "alh+wec", "SP", "zusage", 10], ["FS27", "", "BP", "offen"], ["", "", "PP", "offen"]],
    ["FS26", "Zweitfach", ["FS26", "wec", "BP", "abgeschlossen", 11], ["FS27", "", "PP", "pxl_suchen"], ["FS27", "wec", "IVA", "laeuft"]],
    ["HS24", "Monofach", ["HS24", "wec", "SP", "abgeschlossen", 4], ["HS25", "wec", "BP", "abgeschlossen", 6], ["HS25", "alh", "PP", "abgeschlossen", 1], ["HS25", "wec", "PA", "abgeschlossen"], ["FS27", "wec", "IVA", "laeuft"]],
  ];
  const pxlListe = pxl.map((x) => x.id), d = (sem, t) => { const y = 2000 + Number(sem.slice(2)); return sem.startsWith("HS") ? `${y}-${t < 5 ? "09" : t < 9 ? "11" : "12"}-${String(4 + t * 2).padStart(2, "0")}` : `${y}-0${3 + (t % 4)}-${String(5 + t).padStart(2, "0")}`; };
  plan.forEach(([start, profil, ...pr], i) => {
    const sid = "sb" + i;
    studis.push({ id: sid, name: nn[i], vorname: vn[(i + 3) % 12], mail: i % 4 ? `stud${i}@beispiel.invalid` : "", start, profil, faecher: "MA", wohnort: ["Luzern", "Zug", "Olten", "Altdorf", "Zürich", "Sursee", "Horw", "Basel", "Schwyz"][i], pensum: i % 3 ? "Vollzeit" : "Teilzeit (arbeitet 50%)", wpb: i === 2, abschluss: "", bemerkung: i === 4 ? "Wunsch: nicht vor 8 Uhr" : "", stand: i === 8 ? "aktiv" : "aktiv" });
    pr.forEach(([sem, doz, art, status, px], j) => {
      const p = { id: `pb${i}${j}`, student: sid, art, semester: sem, doz: doz ? doz.split("+") : [], status };
      if (ART[art].praktikum) { p.umfang = { SP: "18 L", BP: profil === "Monofach" ? "36 L" : "18 L", PP: profil === "Monofach" ? "18 L" : "9 L" }[art]; if (art === "BP" && i === 2) { p.bms = true; p.bmsText = "BMS Werkstadt"; } if (px !== undefined && !["offen", "pxl_suchen"].includes(status)) p.pxl = pxlListe[(px + i) % pxlListe.length]; if (["ub_geplant", "abgeschlossen"].includes(status)) { p.ub = d(sem, (i + j) % 10); p.ubZeit = ["08:00", "09:45", "10:15", "13:30"][(i + j) % 4]; p.ubBis = ["08:45", "10:30", "11:00", "14:15"][(i + j) % 4]; p.avb = true; }
        if (p.ub) { const kl = ["2a", "3b", "4c", "1d"][(i + j) % 4], raum = String(100 + i * 7 + j); p.lektionen = [-14, -7, 0, 7, 14, 21].map((t, k) => { const d = new Date(p.ub + "T12:00:00"); d.setDate(d.getDate() + t); return { art: k === 0 ? "H" : "U", datum: d.toISOString().slice(0, 10), von: p.ubZeit, bis: p.ubBis, klasse: kl, anzahl: "1", raum }; }); } if (status === "avb") p.avb = true; if (status === "pxl_suchen") p.wunsch = ["Jan / Feb", "Okt / Nov, nicht Zug", "ab März"][i % 3]; }
      else { p.thema = ["Modellieren im Unterricht", "Escape-Room und lineare Funktionen", "Lernen mit Beispielaufgaben", "Funktionen dynamisch"][i % 4]; p.abgabe = status === "abgeschlossen" ? "" : "6.27"; }
      praktika.push(p);
    });
  });
  await schreibeJSON("stamm/studierende.json", { personen: studis });
  await schreibeJSON("stamm/praxislehrpersonen.json", { personen: pxl, schultypen: { Gymnasium: "PP nur an Kantonsschule", FMS: "PP geht nicht, max. SP oder BP (nicht beides)", BMS: "PP geht nicht, max. SP oder BP (nicht beides)" } });
  await schreibeJSON("stamm/praktika.json", { praktika, stand: new Date().toISOString().slice(0, 19), quelle: "Beispieldaten" });
  await schreibeJSON("stamm/einstellungen.json", Object.assign({}, EINST_STD, { team: [{ kuerzel: "alh", name: "Doz Anna" }, { kuerzel: "wec", name: "Doz Beat", mail: "doz.beat@beispiel.invalid" }], ziele: [{ text: "Ziel HS26/FS27", semester: ["HS26", "FS27"], SPBP: 10, PP: 7 }] }));
  if (!S.ich) S.ich = "alh";
  await allesLaden();
}
